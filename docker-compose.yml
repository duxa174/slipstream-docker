services:
  slipstream-ss:
    build: .
    profiles: ["interactive"]
    stdin_open: true   # -i for interactive input
    tty: true          # -t for terminal (interactive wizard)
    ports:
      - "${HOST_DNS_PORT:-53}:53/udp"
    volumes:
      - slipstream-data:/data
    restart: unless-stopped

  slipstream-ss-noninteractive:
    build: .
    profiles: ["non-interactive"]
    ports:
      - "${HOST_DNS_PORT:-53}:53/udp"
    volumes:
      - slipstream-data:/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  slipstream-data:
